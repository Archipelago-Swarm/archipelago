[project]
name = "archipelago-contracts"
version = "0.1.0"
description = "Canonical v0 shared records for Archipelago (Pydantic source of truth)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archipelago_contracts"]
