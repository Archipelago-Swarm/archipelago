[project]
name = "archipelago"
version = "0.0.0"
description = "Archipelago workspace root (decentralized drone learning simulator)"
requires-python = ">=3.12"
dependencies = ["archipelago-contracts"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts"]

[tool.uv.sources]
archipelago-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "tests/contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
