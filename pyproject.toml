[project]
name = "archipelago"
version = "0.0.0"
description = "Archipelago workspace root (decentralized drone learning simulator)"
requires-python = ">=3.12"
dependencies = ["archipelago-contracts", "archipelago-api"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pettingzoo>=1.27.0",
    "gymnasium>=1.4.0",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "services/api"]

[tool.uv.sources]
archipelago-contracts = { workspace = true }
archipelago-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "tests/contracts", "services/api/src", "tests/api",
         "packages/storage/archipelago_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
