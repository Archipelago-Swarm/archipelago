[project]
name = "archipelago"
version = "0.0.0"
description = "Archipelago workspace root (decentralized drone learning simulator)"
requires-python = ">=3.12"
dependencies = ["archipelago-contracts", "archipelago-api"]

[dependency-groups]
# Live learners (agents/architecture/live-runtime.md section 10). Not part of `dev`: the PyPI Linux wheel
# pulls ~3 GB of CUDA packages. Local dev: `uv sync --frozen --group torch`. CI/images install the CPU
# wheel: `uv pip install --torch-backend cpu torch==2.14.1`.
torch = ["torch==2.14.1"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pettingzoo>=1.27.0",
    "gymnasium>=1.4.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contracts", "services/api"]

[tool.uv.sources]
archipelago-contracts = { workspace = true }
archipelago-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"agents/*.py" = ["E501"]  # long help/prompt strings; ruff format still applies

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "tests/contracts", "services/api/src", "tests/api",
         "packages/storage/archipelago_storage", "agents/controller.py", "agents/launch.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a reachable Docker daemon (excluded from check-integration, run by check-full and CI)"]
