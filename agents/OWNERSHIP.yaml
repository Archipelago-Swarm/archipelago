# Path ownership. A task's owned_paths must sit inside one or more domains below (or be explicitly
# integrator-owned). The controller refuses to run, and validate rejects, two in-flight tasks whose
# owned_paths overlap. Shared files (domain "shared") are changed only by the integrator.
roles:
  # All coding agents run as Claude cloud sessions; there are no machines A/B any more. Every role
  # is held by the one "cloud" pool ("*"). Independence is by session: a verifier never owns the
  # task it verifies (controller.py verify). A/B remain accepted labels for old ledger history.
  orchestrator: "*"
  integrator: "*"
  verifier: "*"
  reviewer: "*"
domains:
  contracts:         # public interfaces; change needs an ADR and the integrator
    paths: [packages/contracts/**, tests/contracts/**]
  simulation:
    paths: [packages/sim/**, packages/adapters/sim2d/**, tests/sim/**]
  networking:
    paths: [packages/transport/**, packages/node/peer/**, tests/transport/**]
  learning:
    paths: [packages/learning/**, packages/node/learner/**, tests/learning/**, experiments/**, tests/experiments/**]
  runtime:           # the API / run lifecycle
    paths: [services/api/**, tests/api/**]
  web:
    paths: [apps/web/**, tests/web/**]
  coordinator:       # live-runtime world service (agents/architecture/live-runtime.md)
    paths: [services/coordinator/**, tests/coordinator/**]
  noderuntime:       # per-drone container runtime
    paths: [packages/node/runtime/**, tests/noderuntime/**]
  e2e:
    paths: [tests/e2e/**]
  telemetry:
    paths: [packages/storage/**, observability/**, tests/storage/**, tests/observability/**]
  adapters3d:
    paths: [packages/adapters/pybullet/**, infra/3d/**, tests/adapters3d/**]
  infrastructure:
    paths: [infra/**, tests/infra/**]
  demo:
    paths: [apps/demo-video/**, experiments/presentation/**, agents/demo/**]
  agents:
    paths: [agents/**, tools/agents/**, tests/agents/**, tools/check_foundation.py]
  shared:            # integrator only
    paths: [pyproject.toml, uv.lock, package.json, package-lock.json, .github/**, Makefile,
            scripts/**, CLAUDE.md, AGENTS.md, .gitattributes, .gitignore]
