name: Main Integration
# Tier 2. Runs after merge; does the integrated app start and behave? Never blocks PRs.
on:
  push:
    branches: [main]
    paths-ignore: ["agents/TASKS.yaml", "agents/STATUS.yaml", "agents/handoffs/**"]
  workflow_dispatch:

concurrency:
  group: main-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/ci.Dockerfile
          tags: archipelago-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm archipelago-ci

  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: make demo PLAN=smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-smoke
          path: artifacts/demo/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: CHECK_PART=web scripts/check.sh
