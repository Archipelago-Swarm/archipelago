name: PR Gate
# Tier 1. The only required merge check is the aggregate job "PR Gate" (set it as the sole required status).
# Everything deeper lives in main.yml (on push to main) and full.yml (nightly / manual / label "full").
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the running one (ADR-0005).
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          # Web checks only when frontend code, JS tooling, or contracts shared with the frontend change.
          if [ "${{ github.event_name }}" != pull_request ]; then echo web=true >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -Eq '^(apps/|packages/contracts/|package(-lock)?\.json$|eslint\.config|tsconfig)'; then
            echo web=true >> "$GITHUB_OUTPUT"
          else
            echo web=false >> "$GITHUB_OUTPUT"
          fi

  # Static checks cheapest-first, then fast torch-free tests. No torch, no node, no docker.
  core-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: make check-fast

  web-fast:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: CHECK_PART=web scripts/check.sh

  # Stable required-check name; passes when every non-skipped job passed.
  pr-gate:
    name: PR Gate
    if: always()
    needs: [core-fast, web-fast]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
