name: Full Regression
# Tier 3. Nightly, manual, or on a PR labelled "full". Never a required check.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-slice:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full')
    strategy:
      fail-fast: false
      matrix:
        part: [py-live, py-rest, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/install-torch-cpu.sh  # these slices import torch at collection time
      - run: CHECK_PART=${{ matrix.part }} scripts/check.sh
